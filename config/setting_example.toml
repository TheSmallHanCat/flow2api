[global]
api_key = "han1234"
admin_username = "admin"
admin_password = "admin"

[flow]
labs_base_url = "https://flow.google.com"
api_base_url = "https://flow.google.com"
timeout = 120
max_retries = 3
image_request_timeout = 40
image_timeout_retry_count = 1
image_timeout_retry_delay = 0.8
image_timeout_use_media_proxy_fallback = true
image_prefer_media_proxy = false
image_slot_wait_timeout = 480
image_launch_soft_limit = 20
image_launch_wait_timeout = 480
image_launch_stagger_ms = 0
video_slot_wait_timeout = 480
video_launch_soft_limit = 20
video_launch_wait_timeout = 480
video_launch_stagger_ms = 0
poll_interval = 3.0

[server]
host = "0.0.0.0"
port = 8000

[debug]
enabled = false
log_requests = true
log_responses = true
mask_token = true

[proxy]
proxy_enabled = false
proxy_url = ""

[generation]
image_timeout = 300
video_timeout = 1500

[call_logic]
call_mode = "default"  # default=randomized round-robin; polling=sequential round-robin

[admin]
error_ban_threshold = 3

[cache]
enabled = false
timeout = 7200  # Cache timeout in seconds; defaults to 2 hours. Set to 0 to disable automatic cache deletion
base_url = ""   # Base URL for accessing cached files; leave empty to use the server address

[captcha]
captcha_method = "yescaptcha"  # Captcha provider: yescaptcha/flow2api_team (built-in team solver with fixed URL and key)/captcharun/twocaptcha/capsolver/ezcaptcha/browser/personal/remote_browser
browser_recaptcha_settle_seconds = 3.0  # Additional stabilization delay after reload/clr is ready during custom site-score testing
browser_flow_page_warmup_seconds = 6.0  # Stabilization delay after browser harvest opens the Flow page
browser_count = 1  # Number of headed browser instances in browser mode
browser_captcha_max_retries = 5  # Maximum retries for a single captcha retrieval in browser mode
browser_captcha_generation_retries = 6  # Total retries when the generation endpoint encounters reCAPTCHA evaluation failed
personal_solve_strategy = "auto"  # auto=prefer trusted JS, falling back to native harvesting on failure; direct/harvest can be selected explicitly
personal_project_pool_size = 4  # Default project-pool size maintained per token in personal mode (affects project rotation only, not the number of captcha tabs)
personal_max_resident_tabs = 5  # Maximum number of shared captcha tabs in personal mode; all tokens/projects share this set of tabs
browser_personal_fresh_restart_every_n_solves = 10  # In personal mode, clean up and restart the browser after this many successful captcha solves; 0 disables this behavior
personal_idle_tab_ttl_seconds = 600  # Idle tab cleanup timeout in seconds for personal mode
yescaptcha_api_key = ""  # YesCaptcha API key
yescaptcha_base_url = "https://api.yescaptcha.com"
yescaptcha_task_type = "RecaptchaV3TaskProxylessM1S9"  # Options: RecaptchaV3TaskProxyless/RecaptchaV3TaskProxylessM1/RecaptchaV3TaskProxylessM1S7/RecaptchaV3TaskProxylessM1S9
remote_browser_base_url = ""  # Remote headed captcha service URL
remote_browser_api_key = ""   # Remote headed captcha service API key
remote_browser_timeout = 60   # Remote headed captcha request timeout in seconds
capsolver_api_key = ""
capsolver_base_url = "https://api.capsolver.com"
captcharun_api_key = ""
captcharun_base_url = "https://api.captcha-run.com"

twocaptcha_api_key = ""
twocaptcha_base_url = "https://api.2captcha.com"
